services:

  postgres:
    image: postgres:15
    container_name: evo_postgres
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: evo_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    image: evoapicloud/evolution-api:latest
    container_name: evo_api
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      AUTHENTICATION_API_KEY: teste123
      SERVER_PORT: 8080
      SERVER_TYPE: http
    ports:
      - "8080:8080"

volumes:
  postgres_data: